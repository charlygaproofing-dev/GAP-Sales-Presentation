// ---------- CRM connection helpers ----------
function getConn() {
  try {
    return JSON.parse(localStorage.getItem("gapSalesToolConn") || "null");
  } catch (e) { return null; }
}
function setConn(url, token) {
  localStorage.setItem("gapSalesToolConn", JSON.stringify({ url, token }));
}

async function createCrmJob(job) {
  const conn = getConn();
  if (!conn || !conn.url || !conn.token) throw new Error("not connected");
  const res = await fetch(conn.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "createJob", token: conn.token, job })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ---------- Step: Agreement ----------
function SignaturePad({ label, onChange }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const hasInk = useRef(false);

  function getPos(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e) {
    e.preventDefault();
    drawing.current = true;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }
  function move(e) {
    if (!drawing.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = NAVY;
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    hasInk.current = true;
  }
  function end() {
    if (!drawing.current) return;
    drawing.current = false;
    if (hasInk.current) onChange(canvasRef.current.toDataURL("image/png"));
  }
  function clear() {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasInk.current = false;
    onChange(null);
  }

  return React.createElement("div", null,
    React.createElement("div", { style: { fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 4 } }, label),
    React.createElement("canvas", {
      ref: canvasRef, width: 340, height: 90,
      style: { width: "100%", maxWidth: 340, height: 90, background: "#fff", border: `1px dashed ${BORDER}`, borderRadius: 6, touchAction: "none" },
      onMouseDown: start, onMouseMove: move, onMouseUp: end, onMouseLeave: end,
      onTouchStart: start, onTouchMove: move, onTouchEnd: end
    }),
    React.createElement("button", { type: "button", onClick: clear, style: { marginTop: 4, fontSize: 11, background: "none", border: "none", color: MUTE, textDecoration: "underline", cursor: "pointer" } }, "Clear")
  );
}

  if (!connected) return React.createElement(ConnectScreen, { t, onConnected: () => setConnected(true) });

    setSending(true);

    try {
      const job = {
        customerName: form.customerName || "Unnamed customer",
        coOwner: form.coOwnerName || null,
        phone: form.phone, email: form.email,
        propertyAddress: form.propertyAddress, ownerAddress: form.propertyAddress,
        insuranceCarrier: form.insuranceCarrier || null,
        claimNum: form.claimNum || null,
        insPolicyNumber: form.policyNumber || null,

        jobType: form.insuranceCarrier ? "Insurance" : "Cash",

        leadSource: "Sales Presentation Tool",
        salesRep: form.salesRep || null

      setSentJobId(res.id || null);
      setSent(true);
    } catch (e) {
      setSendError(true);
    } finally {
      setSending(false);
    }
  }

  const canAdvanceFromCustomer = index !== 5 || (form.customerName.trim() && form.propertyAddress.trim());

  function next() { if (index < STEP_KEYS.length - 1) setIndex(index + 1); }

        }, l.toUpperCase()))
